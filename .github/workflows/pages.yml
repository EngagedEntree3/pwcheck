# Build and publish the browser UI to GitHub Pages.
#
# Pages' branch-based deployment can only serve the repository root or /docs,
# and the UI lives in web/. A workflow lets us publish that directory as-is
# without restructuring the repo or duplicating files.
#
# The UI has no build step, so "building" is just uploading web/ verbatim.
name: Deploy UI to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it: a half-applied
# deployment is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Runs both suites and the staleness check on the generated files.
      # Gating the deploy on this means a broken scorer never reaches the
      # published page.
      - name: Run test suites
        run: ./tools/run_tests.sh

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v4
